<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recobook | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <a href="{{ url_for('home') }}" class="logo-link">
            <div class="logo-text">Recobook</div>
        </a>

        <a href="{{ url_for('home') }}" class="logo-link">
            <div class="logo-badge">
                <img src="https://cdn-icons-png.flaticon.com/512/2232/2232688.png" alt="book icon" width="20" style="filter: invert(1);">
                <span>Recobook AI</span>
            </div>
        </a>
    </header>

    <main class="container">
        <h1>Smart Book Discovery <br> powered by AI</h1>

        <div class="login-card">
            <h2>Login</h2>
            <form id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email Address" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit" class="login-btn">Sign In</button>
            </form>
            
            <p class="footer-text">New to Recobook? <a href="/signup_page">Create Account</a></p>
        </div>
    </main>

    <script src="{{ url_for('static', filename='auth.js') }}"></script>
</body>
</html>
